[project]
name = "ri-cloud-api"
authors = [{ name = "Jørgen Herje", email = "jorgen.herje@gmail.com" }]
requires-python = ">=3.11"
version = "0.0.0"
description = "Local-hosted backend service bridging Sumo data into ResInsight over a FastAPI HTTP API."
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<3.0.0",
    "ri-cloud-services",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17.0",
    "mypy>=1.18.2,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
]

[tool.uv.workspace]
members = [
    "libs/services",
    "libs/core_utils",
]

[tool.uv.sources]
ri-cloud-services = { workspace = true }

[tool.ruff]
line-length = 120


[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = [
    "libs/services/src",
    "libs/core_utils/src",
]

[[tool.mypy.overrides]]
module = [
    "fmu.sumo.*",
    "sumo.wrapper.*",
]
follow_untyped_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
